backend:
  name: git-gateway
  branch: main

publish_mode: editorial_workflow

media_folder: "src/assets/images/uploads"
public_folder: "/assets/images/uploads"

collections:
  - name: "homepage"
    label: "Homepage"
    files:
      - label: "What is Agni Yoga? Section"
        name: "agni_yoga_section"
        file: "src/_data/home.json"
        fields:
          - label: "Agni Yoga Section"
            name: "agni_yoga_section"
            widget: "object"
            fields:
              - {label: "Small Label", name: "label", widget: "string"}
              - {label: "Heading", name: "heading", widget: "string"}
              - label: "Body Paragraphs"
                name: "body"
                widget: "list"
                field: {label: "Paragraph", name: "paragraph", widget: "text"}
              - {label: "Button Label", name: "cta_label", widget: "string"}
              - {label: "Button URL", name: "cta_url", widget: "string"}
              - {label: "Attributes Heading", name: "attributes_heading", widget: "string", required: false}
              - label: "Attribute Cards"
                name: "attributes"
                widget: "list"
                fields:
                  - {label: "Title", name: "title", widget: "string"}
                  - {label: "Description", name: "description", widget: "string"}

  - name: "about_page"
    label: "About Page"
    files:
      - label: "About Page Sections"
        name: "about_sections"
        file: "src/_data/about.json"
        fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - {label: "Small Label", name: "label", widget: "string"}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Subtitle", name: "subtitle", widget: "text"}
          - label: "Seven Pillars Article"
            name: "overview"
            widget: "object"
            fields:
              - {label: "Small Label", name: "label", widget: "string"}
              - {label: "Heading", name: "heading", widget: "string"}
              - {label: "Author", name: "author", widget: "string"}
              - {label: "Author Title", name: "author_title", widget: "string"}
              - label: "Intro Paragraphs"
                name: "intro"
                widget: "list"
                field: {label: "Paragraph", name: "paragraph", widget: "text"}
              - label: "Pillars"
                name: "pillars"
                widget: "list"
                fields:
                  - {label: "Title", name: "title", widget: "string"}
                  - label: "Body Paragraphs"
                    name: "body"
                    widget: "list"
                    field: {label: "Paragraph", name: "paragraph", widget: "text"}
          - label: "Roerich Section"
            name: "roerich"
            widget: "object"
            fields:
              - {label: "Small Label", name: "label", widget: "string"}
              - {label: "Heading", name: "heading", widget: "string"}
              - label: "Feature Image"
                name: "image"
                widget: "object"
                fields:
                  - {label: "Image", name: "src", widget: "image"}
                  - {label: "Alt Text", name: "alt", widget: "string", hint: "Describes the image for screen readers"}
                  - {label: "Caption", name: "caption", widget: "string"}
              - label: "Columns"
                name: "columns"
                widget: "list"
                fields:
                  - label: "Body Paragraphs"
                    name: "body"
                    widget: "list"
                    field: {label: "Paragraph", name: "paragraph", widget: "text"}
          - label: "Community Section"
            name: "community"
            widget: "object"
            fields:
              - {label: "Small Label", name: "label", widget: "string"}
              - {label: "Heading", name: "heading", widget: "string"}
              - {label: "Body", name: "body", widget: "text"}
              - label: "Buttons"
                name: "buttons"
                widget: "list"
                fields:
                  - {label: "Label", name: "label", widget: "string"}
                  - {label: "URL", name: "url", widget: "string"}
                  - {label: "Style", name: "style", widget: "select", options: ["primary", "outline"]}

  - name: "news"
    label: "News & Events"
    folder: "src/content/news"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Date", name: "date", widget: "datetime"}
      - {label: "Tag", name: "tag", widget: "select", options: ["Event", "Conference", "Publication", "Announcement"]}
      - {label: "Summary", name: "summary", widget: "text", hint: "Shown on the home page card"}
      - {label: "Date Label", name: "date_label", widget: "string", hint: "e.g. September 14–16, 2025 · Helsinki & Online", required: false}
      - {label: "Link URL", name: "link", widget: "string", required: false}
      - {label: "Link Text", name: "link_text", widget: "string", required: false, default: "Details →"}

  - name: "community"
    label: "Community"
    folder: "src/content/community"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Name", name: "title", widget: "string"}
      - label: "Types"
        name: "types"
        widget: "select"
        multiple: true
        options: ["Organization", "Study Group", "Online Study"]
      - {label: "Region", name: "region", widget: "select", options: ["Americas", "Europe", "Asia-Pacific", "Other"], required: false}
      - {label: "Location", name: "location", widget: "string", required: false, hint: "City, Country"}
      - {label: "Format", name: "format", widget: "string", required: false, hint: "e.g. In-person & Online"}
      - {label: "Has Dedicated Page", name: "has_page", widget: "boolean", default: false, required: false}
      - {label: "Address", name: "address", widget: "string", required: false}
      - {label: "Phone", name: "phone", widget: "string", required: false}
      - {label: "Email", name: "email", widget: "string", required: false}
      - {label: "Website", name: "website", widget: "string", required: false}
      - {label: "Link Text", name: "link_text", widget: "string", required: false, hint: "Custom label for the website button"}
      - {label: "Link Type", name: "link_type", widget: "select", options: ["email"], required: false, hint: "Set to 'email' if the website field contains a mailto: link"}
      - {label: "Secondary Link", name: "secondary_link", widget: "string", required: false}
      - {label: "Secondary Link Text", name: "secondary_link_text", widget: "string", required: false}
      - {label: "Established", name: "established", widget: "string", required: false, hint: "e.g. 1920"}
      - {label: "Tax Status", name: "tax_status", widget: "string", required: false}
      - {label: "Founder", name: "founder", widget: "string", required: false}
      - {label: "Membership", name: "membership", widget: "string", required: false}
      - {label: "Fees", name: "fees", widget: "string", required: false}
      - label: "Visiting Hours"
        name: "visiting_hours"
        widget: "list"
        required: false
        fields:
          - {label: "Days", name: "days", widget: "string"}
          - {label: "Hours", name: "hours", widget: "string"}
      - {label: "Extra Sidebar Card Title", name: "extra_title", widget: "string", required: false, hint: "e.g. Bookstore or Free Online Texts"}
      - {label: "Extra Sidebar Card Body", name: "extra_body", widget: "text", required: false}
      - {label: "Extra Sidebar Card Link", name: "extra_link", widget: "string", required: false}
      - {label: "Extra Sidebar Card Link Text", name: "extra_link_text", widget: "string", required: false}
      - {label: "Short Description", name: "short_description", widget: "text", hint: "2–3 sentences shown on the community card"}
      - {label: "Full Content", name: "body", widget: "markdown", required: false, hint: "Full content for entries with a dedicated page"}
      - {label: "Display Order", name: "order", widget: "number", default: 99, hint: "Lower numbers appear first"}

  - name: "resources"
    label: "Resources"
    folder: "src/content/resources"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Icon", name: "icon", widget: "string", hint: "Paste an emoji, e.g. 📖"}
      - {label: "Description", name: "description", widget: "text"}
      - {label: "Link URL", name: "link", widget: "string", required: false}
      - {label: "Link Text", name: "link_text", widget: "string", required: false, default: "View →"}
      - {label: "External Link", name: "external", widget: "boolean", default: false}
      - {label: "Display Order", name: "order", widget: "number", default: 99}
