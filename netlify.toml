[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/join/"
  to = "/connect/"
  status = 301

[[redirects]]
  from = "https://agniyogaworldcommunity.org/*"
  to = "https://agniyogaworld.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.agniyogaworldcommunity.org/*"
  to = "https://agniyogaworld.org/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # script-src has no 'unsafe-inline': all site JS lives in /assets/js/.
    # style-src keeps 'unsafe-inline' because templates use style="" attributes.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://forum.agniyogaworld.org; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    # Decap CMS needs 'unsafe-eval' and broad img/connect; scripts are restricted
    # to self + the two pinned CDNs instead of all of https:.
    Content-Security-Policy = "default-src 'self' 'unsafe-inline' https:; script-src 'self' 'unsafe-eval' https://unpkg.com https://identity.netlify.com; img-src 'self' data: blob: https:; frame-src 'self' https://identity.netlify.com https://www.netlify.com; frame-ancestors 'self'; base-uri 'self'; object-src 'none'"
